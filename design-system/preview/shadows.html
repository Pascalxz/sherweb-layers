<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#F9FAFB;}
.card{padding:26px 24px;box-sizing:border-box;display:flex;gap:18px;align-items:flex-end;}
.box{background:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0061AA;font:700 16px var(--ff-sans);padding:0 12px;}
.cap{display:block;font:500 10px ui-monospace,monospace;color:#76889A;margin-top:6px;text-align:center;}
</style></head><body><div class="card">
<div><div class="box" style="box-shadow:var(--shadow-sm);width:96px;height:72px">.sm</div><span class="cap">shadow-sm</span></div>
<div><div class="box" style="box-shadow:var(--shadow);width:96px;height:72px">.</div><span class="cap">shadow</span></div>
<div><div class="box" style="box-shadow:var(--shadow-md);width:96px;height:72px">.md</div><span class="cap">shadow-md</span></div>
<div><div class="box" style="box-shadow:var(--shadow-lg);width:96px;height:72px">.lg</div><span class="cap">shadow-lg</span></div>
<div><div class="box" style="box-shadow:var(--shadow-xl);width:96px;height:72px">.xl</div><span class="cap">shadow-xl</span></div>
<div><div class="box" style="box-shadow:var(--shadow-2xl);width:96px;height:72px">.2xl</div><span class="cap">shadow-2xl</span></div>
</div></body></html>
