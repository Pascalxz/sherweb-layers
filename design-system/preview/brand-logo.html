<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#F4F6F7;}
.card{padding:22px 24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
.logo-wrap{background:#fff;border:1px solid #E2E7EB;border-radius:16px;padding:20px 28px;display:flex;align-items:center;}
.logo-wrap.dark{background:#072A4A;border-color:transparent;}
img{display:block;height:36px;}
</style></head><body><div class="card">
<div class="logo-wrap"><img src="../assets/Logo_Sherweb.svg" alt="Sherweb"/></div>
<div class="logo-wrap dark"><img src="../assets/Logo_Sherweb.svg" alt="Sherweb" style="filter:brightness(0) invert(1)"/></div>
</div></body></html>
