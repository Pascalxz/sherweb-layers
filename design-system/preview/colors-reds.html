<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.swatch{flex:1;min-width:0;height:72px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box;color:#fff;font:600 11px var(--ff-sans);letter-spacing:.2px;border:1px solid rgba(0,0,0,0.04);}
.swatch .hex{font-family:ui-monospace,monospace;font-weight:500;opacity:0.85;font-size:10px;}
.tag{display:inline-block;font:500 11px var(--ff-sans);color:#76889A;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;}
</style></head><body><div class="card">
<div class="tag">Accent — reds (CTA)</div>
<div class="row">
<div class="swatch" style="background:#B93624">Red 700<span class="hex">#B93624 · hover</span></div>
<div class="swatch" style="background:#DB4227">Red 600<span class="hex">#DB4227 · primary CTA</span></div>
<div class="swatch" style="background:#ED573C">Red 500<span class="hex">#ED573C · accent</span></div>
</div>
</div></body></html>
