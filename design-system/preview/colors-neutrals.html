<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{flex:1;min-width:0;height:72px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box;color:#fff;font:600 11px var(--ff-sans);letter-spacing:.2px;border:1px solid rgba(0,0,0,0.04);}
.swatch.light{color:#0b1220;}
.swatch .hex{font-family:ui-monospace,monospace;font-weight:500;opacity:0.85;font-size:10px;}
.tag{display:inline-block;font:500 11px var(--ff-sans);color:#76889A;letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px;}
</style></head><body><div class="card">
<div class="tag">Neutrals</div>
<div class="row">
<div class="swatch" style="background:#000000">Black<span class="hex">#000000</span></div>
<div class="swatch" style="background:#090A0C">Ink 900<span class="hex">#090A0C</span></div>
<div class="swatch" style="background:#2F2D2E">Ink 700<span class="hex">#2F2D2E</span></div>
<div class="swatch" style="background:#4E5B6C">Ink 500<span class="hex">#4E5B6C</span></div>
<div class="swatch" style="background:#76889A">Slate 500<span class="hex">#76889A</span></div>
<div class="swatch light" style="background:#A3B0BD">Slate 400<span class="hex">#A3B0BD</span></div>
<div class="swatch light" style="background:#E2E7EB">Slate 200<span class="hex">#E2E7EB</span></div>
<div class="swatch light" style="background:#F4F6F7">Slate 100<span class="hex">#F4F6F7</span></div>
<div class="swatch light" style="background:#FFFFFF">White<span class="hex">#FFFFFF</span></div>
</div>
</div></body></html>
