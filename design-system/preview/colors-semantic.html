<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:18px 24px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sem{border:1px solid #E2E7EB;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;}
.sw{width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);flex-shrink:0;}
.meta{font:500 12px var(--ff-sans);color:#090A0C;line-height:1.35;}
.meta small{display:block;color:#76889A;font-size:10px;font-family:ui-monospace,monospace;font-weight:500;}
.tag{grid-column:1/-1;font:500 11px var(--ff-sans);color:#76889A;letter-spacing:.4px;text-transform:uppercase;margin:0;}
</style></head><body><div class="card">
<div class="tag">Semantic tokens</div>
<div class="sem"><div class="sw" style="background:#FFFFFF;border-color:#E2E7EB"></div><div class="meta">--color-bg<small>#FFFFFF</small></div></div>
<div class="sem"><div class="sw" style="background:#DFF0FF"></div><div class="meta">--color-bg-tint<small>#DFF0FF</small></div></div>
<div class="sem"><div class="sw" style="background:#F4F6F7"></div><div class="meta">--color-surface-alt<small>#F4F6F7</small></div></div>
<div class="sem"><div class="sw" style="background:#072A4A"></div><div class="meta">--color-bg-inverse<small>#072A4A</small></div></div>
<div class="sem"><div class="sw" style="background:#090A0C"></div><div class="meta">--color-fg<small>#090A0C</small></div></div>
<div class="sem"><div class="sw" style="background:#76889A"></div><div class="meta">--color-fg-muted<small>#76889A</small></div></div>
<div class="sem"><div class="sw" style="background:#0061AA"></div><div class="meta">--color-brand<small>#0061AA</small></div></div>
<div class="sem"><div class="sw" style="background:#DB4227"></div><div class="meta">--color-accent<small>#DB4227</small></div></div>
<div class="sem"><div class="sw" style="background:#E2E7EB"></div><div class="meta">--color-border<small>#E2E7EB</small></div></div>
<div class="sem"><div class="sw" style="background:#34AFFC"></div><div class="meta">--color-focus-ring<small>#34AFFC</small></div></div>
</div></body></html>
