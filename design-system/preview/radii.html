<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:20px 24px;box-sizing:border-box;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
.box{width:72px;height:72px;background:#DFF0FF;border:1px solid #A0E3FF;display:flex;align-items:center;justify-content:center;color:#0061AA;font:700 12px var(--ff-sans);}
.cap{display:block;font:500 10px ui-monospace,monospace;color:#76889A;margin-top:6px;text-align:center;}
</style></head><body><div class="card">
<div><div class="box" style="border-radius:2px">2</div><span class="cap">xs · 2px</span></div>
<div><div class="box" style="border-radius:4px">4</div><span class="cap">sm · 4px</span></div>
<div><div class="box" style="border-radius:8px">8</div><span class="cap">lg · 8px (buttons)</span></div>
<div><div class="box" style="border-radius:12px">12</div><span class="cap">xl · 12px</span></div>
<div><div class="box" style="border-radius:16px">16</div><span class="cap">2xl · 16px (cards)</span></div>
<div><div class="box" style="border-radius:24px">24</div><span class="cap">3xl · 24px</span></div>
<div><div class="box" style="border-radius:40px">40</div><span class="cap">4xl · 40px</span></div>
<div><div class="box" style="border-radius:9999px">●</div><span class="cap">pill</span></div>
</div></body></html>
