<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:20px 24px;box-sizing:border-box;display:flex;gap:14px;flex-wrap:wrap;}
.g{flex:1;min-width:180px;height:120px;border-radius:16px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;box-sizing:border-box;color:#fff;font:600 12px var(--ff-sans);border:1px solid rgba(0,0,0,.05);}
.g small{display:block;font-family:ui-monospace,monospace;font-weight:500;font-size:10px;opacity:.85;margin-top:2px;}
.g.light{color:#0b1220;}
</style></head><body><div class="card">
<div class="g" style="background:linear-gradient(180deg,#0A4270 0%,#072A4A 100%)">Ocean<small>linear-gradient 180° · Blue 900 → Blue 950</small></div>
<div class="g" style="background:linear-gradient(180deg,#34AFFC 0%,#0061AA 100%)">Blue linear<small>Blue 500 → Blue 700</small></div>
<div class="g light" style="background:linear-gradient(180deg,#DFF0FF 0%,#FFFFFF 100%)">Sky<small>Blue 100 → White</small></div>
</div></body></html>
