<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ff-sans);color:#090A0C;}
.wrap{padding:22px 24px;display:flex;flex-direction:column;gap:18px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#76889A;width:130px;flex:none;}
.chip{width:44px;height:44px;border-radius:8px;background:#DFF0FF;color:#0061AA;display:flex;align-items:center;justify-content:center;font-size:18px;}
.chip.circle{border-radius:9999px;}
.chip.red{background:#DB4227;color:#fff;}
.chip.dark{background:#072A4A;color:#fff;}
.chip.none{background:transparent;color:#0061AA;border:1px solid #E2E7EB;}
.chip.lg{width:56px;height:56px;font-size:22px;}
</style></head><body><div class="wrap">

<div class="row"><div class="label">Classic · Light</div>
<div class="chip"><i class="fa-light fa-arrow-right"></i></div>
<div class="chip circle"><i class="fa-light fa-chevron-down"></i></div>
<div class="chip none"><i class="fa-light fa-magnifying-glass"></i></div>
<div class="chip lg"><i class="fa-light fa-cloud"></i></div>
</div>

<div class="row"><div class="label">Classic · Regular</div>
<div class="chip"><i class="fa-regular fa-arrow-right"></i></div>
<div class="chip circle"><i class="fa-regular fa-chevron-down"></i></div>
<div class="chip none"><i class="fa-regular fa-magnifying-glass"></i></div>
<div class="chip lg"><i class="fa-regular fa-cloud"></i></div>
</div>

<div class="row"><div class="label">Classic · Solid</div>
<div class="chip"><i class="fa-solid fa-arrow-right"></i></div>
<div class="chip red"><i class="fa-solid fa-plus"></i></div>
<div class="chip dark"><i class="fa-solid fa-fire"></i></div>
<div class="chip circle red"><i class="fa-solid fa-xmark"></i></div>
<div class="chip lg none"><i class="fa-solid fa-shield-halved"></i></div>
</div>

<div class="row"><div class="label">Sharp · Light</div>
<div class="chip"><i class="fa-sharp fa-light fa-arrow-right"></i></div>
<div class="chip circle"><i class="fa-sharp fa-light fa-chevron-down"></i></div>
<div class="chip none"><i class="fa-sharp fa-light fa-magnifying-glass"></i></div>
<div class="chip lg"><i class="fa-sharp fa-light fa-cloud"></i></div>
</div>

<div class="row"><div class="label">Sharp · Solid</div>
<div class="chip"><i class="fa-sharp fa-solid fa-arrow-right"></i></div>
<div class="chip red"><i class="fa-sharp fa-solid fa-plus"></i></div>
<div class="chip dark"><i class="fa-sharp fa-solid fa-fire"></i></div>
<div class="chip lg none"><i class="fa-sharp fa-solid fa-shield-halved"></i></div>
</div>

<div class="row"><div class="label">Duotone</div>
<div class="chip lg"><i class="fa-duotone fa-cloud"></i></div>
<div class="chip lg"><i class="fa-duotone fa-shield-halved"></i></div>
<div class="chip lg dark"><i class="fa-duotone fa-fire"></i></div>
</div>

<div class="row"><div class="label">Brands</div>
<div class="chip lg circle dark"><i class="fa-brands fa-microsoft"></i></div>
<div class="chip lg circle"><i class="fa-brands fa-linkedin"></i></div>
<div class="chip lg circle"><i class="fa-brands fa-x-twitter"></i></div>
<div class="chip lg circle"><i class="fa-brands fa-facebook-f"></i></div>
</div>

</div></body></html>
