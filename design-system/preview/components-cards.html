<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
html,body{margin:0;padding:0;background:#F4F6F7;font-family:var(--ff-sans);}
.card{padding:20px 24px;box-sizing:border-box;display:flex;gap:14px;flex-wrap:wrap;}
.c{background:#fff;border:1px solid #E2E7EB;border-radius:16px;padding:20px;flex:1;min-width:200px;box-shadow:var(--shadow-sm);transition:all .22s cubic-bezier(.2,.7,.2,1);}
.c:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.c .ico{width:40px;height:40px;border-radius:8px;background:#DFF0FF;color:#0061AA;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px;}
.c h3{font:700 18px var(--ff-sans);margin:0 0 6px;color:#090A0C;letter-spacing:0;}
.c p{font:400 14px/1.5 var(--ff-sans);margin:0;color:#76889A;letter-spacing:.25px;}
.c a{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:500 14px var(--ff-sans);color:#0061AA;text-decoration:none;}
</style></head><body><div class="card">
<div class="c"><div class="ico"><i class="fa-solid fa-cloud"></i></div><h3>Microsoft 365</h3><p>Licensing, billing and support in one place.</p><a>Explore <i class="fa-solid fa-arrow-right"></i></a></div>
<div class="c"><div class="ico" style="background:#DB4227;color:#fff"><i class="fa-solid fa-shield-halved"></i></div><h3>Office Protect</h3><p>Security that hardens M365 in a click.</p><a>Explore <i class="fa-solid fa-arrow-right"></i></a></div>
<div class="c"><div class="ico"><i class="fa-solid fa-server"></i></div><h3>Azure</h3><p>Cloud infra your team can actually manage.</p><a>Explore <i class="fa-solid fa-arrow-right"></i></a></div>
</div></body></html>
