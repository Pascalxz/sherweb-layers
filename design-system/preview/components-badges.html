<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ff-sans);}
.card{padding:22px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--ff-sans);letter-spacing:.25px;padding:4px 10px;border-radius:9999px;}
.b1{background:#DFF0FF;color:#0061AA;}
.b2{background:#DB4227;color:#fff;}
.b3{background:#F4F6F7;color:#4E5B6C;border:1px solid #E2E7EB;}
.b4{background:#072A4A;color:#fff;}
.b5{background:#fff;color:#0061AA;border:1px solid #0061AA;}
.dot{width:6px;height:6px;border-radius:9999px;background:currentColor;}
.chip{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--ff-sans);padding:6px 12px;border-radius:9999px;background:#F4F6F7;color:#090A0C;border:1px solid #E2E7EB;}
</style></head><body><div class="card">
<div class="row">
  <span class="badge b1"><span class="dot"></span>New</span>
  <span class="badge b2">Urgent</span>
  <span class="badge b3">Draft</span>
  <span class="badge b4">Partner exclusive</span>
  <span class="badge b5">Beta</span>
</div>
<div class="row">
  <span class="chip">Microsoft 365</span>
  <span class="chip">Azure</span>
  <span class="chip">Dynamics 365</span>
  <span class="chip">Cloud PBX</span>
</div>
</div></body></html>
