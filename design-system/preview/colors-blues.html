<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.swatch{flex:1;min-width:0;height:72px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box;color:#fff;font-family:var(--ff-sans);font-size:11px;font-weight:600;letter-spacing:0.2px;border:1px solid rgba(0,0,0,0.04);}
.swatch .hex{font-family:ui-monospace,monospace;font-weight:500;opacity:0.85;font-size:10px;}
.swatch.light{color:#0b1220;}
.tag{display:inline-block;font:500 11px var(--ff-sans);color:#76889A;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:10px;}
</style></head><body><div class="card">
<div class="tag">Brand blues</div>
<div class="row">
<div class="swatch" style="background:#072A4A">Blue 950<span class="hex">#072A4A</span></div>
<div class="swatch" style="background:#0A4270">Blue 900<span class="hex">#0A4270</span></div>
<div class="swatch" style="background:#0061AA">Blue 700<span class="hex">#0061AA</span></div>
<div class="swatch" style="background:#0A96ED">Blue 600<span class="hex">#0A96ED</span></div>
<div class="swatch" style="background:#34AFFC">Blue 500<span class="hex">#34AFFC</span></div>
<div class="swatch light" style="background:#7BCAFE">Blue 300<span class="hex">#7BCAFE</span></div>
<div class="swatch light" style="background:#DFF0FF">Blue 100<span class="hex">#DFF0FF</span></div>
</div>
</div></body></html>
