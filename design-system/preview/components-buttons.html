<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:22px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
button{font-family:var(--ff-sans);font-weight:500;letter-spacing:1px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:12px 16px;font-size:16px;color:#fff;background:#DB4227;transition:background .2s var(--ease-out,cubic-bezier(.2,.7,.2,1));}
button:hover{background:#B93624;}
button.sec{background:#fff;color:#DB4227;border:1px solid #DB4227;}
button.sec:hover{background:#DB4227;color:#fff;}
button.brand{background:#0061AA;}
button.brand:hover{background:#0A4270;}
button.sm{padding:8px 12px;font-size:14px;}
button.lg{padding:14px 20px;font-size:16px;}
.ghost{background:transparent;color:#0061AA;border:0;}
.ghost:hover{background:#DFF0FF;color:#0061AA;}
</style></head><body><div class="card">
<div class="row">
  <button class="lg"><i class="fa-solid fa-file-pdf"></i>Get guide<i class="fa-solid fa-arrow-right"></i></button>
  <button class="sec lg">Contact sales</button>
</div>
<div class="row">
  <button class="brand">Book a demo<i class="fa-solid fa-arrow-right"></i></button>
  <button class="sm">Sign up</button>
  <button class="ghost">Watch webinar <i class="fa-solid fa-play"></i></button>
</div>
</div></body></html>
