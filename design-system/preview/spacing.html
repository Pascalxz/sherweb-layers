<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;}
.row{display:flex;align-items:center;gap:12px;}
.lbl{font:500 11px ui-monospace,monospace;color:#76889A;width:80px;}
.bar{height:14px;background:#0061AA;border-radius:3px;}
</style></head><body><div class="card">
<div class="row"><span class="lbl">space-1</span><div class="bar" style="width:4px"></div><span class="lbl" style="color:#090A0C;font-weight:600">4px</span></div>
<div class="row"><span class="lbl">space-2</span><div class="bar" style="width:8px"></div><span class="lbl" style="color:#090A0C;font-weight:600">8px</span></div>
<div class="row"><span class="lbl">space-3</span><div class="bar" style="width:12px"></div><span class="lbl" style="color:#090A0C;font-weight:600">12px</span></div>
<div class="row"><span class="lbl">space-4</span><div class="bar" style="width:16px"></div><span class="lbl" style="color:#090A0C;font-weight:600">16px</span></div>
<div class="row"><span class="lbl">space-6</span><div class="bar" style="width:24px"></div><span class="lbl" style="color:#090A0C;font-weight:600">24px</span></div>
<div class="row"><span class="lbl">space-8</span><div class="bar" style="width:32px"></div><span class="lbl" style="color:#090A0C;font-weight:600">32px</span></div>
<div class="row"><span class="lbl">space-12</span><div class="bar" style="width:48px"></div><span class="lbl" style="color:#090A0C;font-weight:600">48px</span></div>
<div class="row"><span class="lbl">space-16</span><div class="bar" style="width:64px"></div><span class="lbl" style="color:#090A0C;font-weight:600">64px</span></div>
<div class="row"><span class="lbl">space-20</span><div class="bar" style="width:80px"></div><span class="lbl" style="color:#090A0C;font-weight:600">80px</span></div>
</div></body></html>
