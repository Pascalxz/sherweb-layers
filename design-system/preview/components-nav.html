<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:var(--ff-sans);}
.card{padding:18px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;}
nav{display:flex;align-items:center;gap:20px;padding:10px 16px;border-radius:12px;background:#fff;border:1px solid #E2E7EB;box-shadow:var(--shadow-sm);}
nav.dark{background:#072A4A;border-color:transparent;}
.logo{font:800 18px var(--ff-sans);color:#DB4227;letter-spacing:-.5px;}
.logo span{color:#0061AA;}
nav.dark .logo{color:#DB4227;}
nav.dark .logo span{color:#fff;}
a{font:500 14px var(--ff-sans);color:#090A0C;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
a:hover{color:#0061AA;}
nav.dark a{color:#fff;}
nav.dark a:hover{color:#7BCAFE;}
.sp{flex:1;}
.cta{background:#DB4227;color:#fff!important;padding:8px 14px;border-radius:8px;letter-spacing:1px;font-weight:500;}
.cta:hover{background:#B93624;color:#fff;}
</style></head><body><div class="card">
<nav>
  <div class="logo">sherweb<span>·</span></div>
  <a>Products <i class="fa-solid fa-chevron-down" style="font-size:10px"></i></a>
  <a>Solutions <i class="fa-solid fa-chevron-down" style="font-size:10px"></i></a>
  <a>Resources</a>
  <a>Pricing</a>
  <div class="sp"></div>
  <a>Sign in</a>
  <a class="cta">Book a demo</a>
</nav>
<nav class="dark">
  <div class="logo">sherweb<span>·</span></div>
  <a>Produits</a><a>Solutions</a><a>Ressources</a>
  <div class="sp"></div>
  <a>Connexion</a>
  <a class="cta">Nous parler</a>
</nav>
</div></body></html>
